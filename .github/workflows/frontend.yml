name: frontend
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proofroom/package-lock.json
      - run: npm ci
        working-directory: proofroom
      - run: npm test
        working-directory: proofroom
      - run: npm run build
        working-directory: proofroom
